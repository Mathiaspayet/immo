# ====================================================================
#  docker compose — Synology, Container Manager
#
#  DEUX FACONS DE L'INSTALLER, au choix.
#
#  A. Sans SSH, depuis DSM (le plus simple)
#     Container Manager > Projet > Creer
#       - chemin : /docker/veille-immo  (creer le dossier)
#       - source : « Creer docker-compose.yml »
#       - coller ce fichier tel quel, puis Suivant jusqu'a Terminer.
#     Container Manager telecharge l'image lui-meme. Rien d'autre a faire :
#     ce fichier fonctionne sans fichier .env a cote.
#
#  B. En SSH
#     Deposer ce fichier dans /volume1/docker/veille-immo/, y ajouter au
#     besoin un .env (voir .env.example), puis :
#       docker compose -f docker-compose.synology.yml up -d
#
#  A NOTER : l'onglet « Registre » de Container Manager ne permet PAS de
#  trouver cette image. Sa recherche interroge Docker Hub, et GHCR n'expose
#  aucune API de recherche — le champ restera vide meme en ajoutant
#  ghcr.io comme registre. Passer par un projet, comme ci-dessus.
#
#  MISES A JOUR
#     Aucune action. Le Watchtower deja installe pour gestion-locative
#     surveille aussi ce conteneur : il porte le meme label de portee.
#     Un push sur `main` reconstruit l'image, Watchtower la deploie dans
#     les cinq minutes.
#
#  PUBLICATION EN HTTPS
#     DSM > Portail des applications > Proxy inverse, avec authentification.
#     L'application n'a pas de gestion de comptes (CDC 9).
# ====================================================================

services:
  veille-immo:
    image: ghcr.io/mathiaspayet/immo:latest
    container_name: veille_immo
    restart: unless-stopped

    ports:
      # 8000 est deja pris par gestion-locative : on expose sur 8020.
      - "${VEILLE_PORT_HOTE:-8020}:8000"

    # Pas de `env_file` : il rendrait un fichier .env obligatoire, et la
    # creation par l'interface DSM echouerait faute de pouvoir en deposer
    # un. Les valeurs ci-dessous ont donc chacune un defaut, et restent
    # surchargeables par un .env pose a cote en SSH.
    environment:
      # Indispensable : sans fuseau, l'import quotidien partirait en UTC.
      TZ: ${TZ:-Europe/Paris}
      # Jour et heure de l'import automatique. « * » = tous les jours ;
      # sinon mon, tue, wed, thu, fri, sat, sun. L'alerte suit l'import.
      VEILLE_IMPORT_JOUR: ${VEILLE_IMPORT_JOUR:-*}
      VEILLE_IMPORT_HEURE: ${VEILLE_IMPORT_HEURE:-7}
      # Mettre a 0 pour desactiver completement l'import automatique.
      VEILLE_PLANIFICATEUR: ${VEILLE_PLANIFICATEUR:-1}
      # DEBUG, INFO, WARNING, ERROR.
      VEILLE_LOG: ${VEILLE_LOG:-INFO}

    volumes:
      # La base SQLite. Sans ce volume, tout serait perdu a chaque mise a
      # jour de l'image par Watchtower (CDC 2).
      - veille-donnees:/data

    labels:
      # Portee du Watchtower deja en place sur le NAS. Ne pas la changer :
      # c'est ce qui fait que ce conteneur est mis a jour automatiquement,
      # sans avoir a lancer un second Watchtower.
      - "com.centurylinklabs.watchtower.scope=gestion-locative"

volumes:
  veille-donnees:
    driver: local
