# ====================================================================
#  docker compose — Synology, Container Manager
#
#  DEUX FACONS DE L'INSTALLER, au choix.
#
#  A. Sans SSH, depuis DSM (le plus simple)
#     Container Manager > Projet > Creer
#       - chemin : /docker/veille-immo  (creer le dossier)
#       - source : « Creer docker-compose.yml »
#       - coller ce fichier tel quel, puis Suivant jusqu'a Terminer.
#     Container Manager telecharge l'image lui-meme. Rien d'autre a faire :
#     ce fichier fonctionne sans fichier .env a cote.
#
#  B. En SSH
#     Deposer ce fichier dans /volume1/docker/veille-immo/, y ajouter au
#     besoin un .env (voir .env.example), puis :
#       docker compose -f docker-compose.synology.yml up -d
#
#  A NOTER : l'onglet « Registre » de Container Manager ne permet PAS de
#  trouver cette image. Sa recherche interroge Docker Hub, et GHCR n'expose
#  aucune API de recherche — le champ restera vide meme en ajoutant
#  ghcr.io comme registre. Passer par un projet, comme ci-dessus.
#
#  MISES A JOUR
#     Aucune action. Le Watchtower deja installe pour gestion-locative
#     surveille aussi ce conteneur : il porte le meme label de portee.
#     Un push sur `main` reconstruit l'image, Watchtower la deploie dans
#     les cinq minutes.
#
#  PUBLICATION EN HTTPS
#     DSM > Portail des applications > Proxy inverse, avec authentification.
#     L'application n'a pas de gestion de comptes (CDC 9).
# ====================================================================

services:
  veille-immo:
    image: ghcr.io/mathiaspayet/immo:latest
    container_name: veille_immo
    restart: unless-stopped

    ports:
      # 8000 est deja pris par gestion-locative : on expose sur 8020.
      - "${VEILLE_PORT_HOTE:-8020}:8000"

    # Pas de `env_file` : il rendrait un fichier .env obligatoire, et la
    # creation par l'interface DSM echouerait faute de pouvoir en deposer
    # un. Les valeurs ci-dessous ont donc chacune un defaut, et restent
    # surchargeables par un .env pose a cote en SSH.
    environment:
      # Indispensable : sans fuseau, l'import quotidien partirait en UTC.
      TZ: ${TZ:-Europe/Paris}
      # ATTENTION : ces variables passent une chaine VIDE quand rien n'est
      # choisi, et c'est VOULU. Y mettre un defaut le ferait GRAVER dans le
      # conteneur a sa creation — Docker substitue a ce moment-la — et
      # Watchtower, qui remplace l'image mais conserve l'environnement,
      # le conserverait indefiniment. Un defaut du compose survit donc aux
      # mises a jour et se met a diverger du code des qu'on le change.
      #
      # C'est arrive : le compose posait « mon » en aout, le code est passe
      # a « * » le meme soir, et le conteneur deploye entre-temps est reste
      # hebdomadaire pendant des semaines. Vide, c'est app/config.py qui
      # tranche, et le rythme suit les mises a jour.
      #
      # Le JOUR et l'HEURE de l'import ne sont plus ici : ils se reglent
      # dans l'ecran Reglages, et vivent en base. Une valeur posee ici
      # serait gravee dans le conteneur a sa creation et survivrait a
      # toutes les mises a jour, sans recours depuis l'interface.
      # Mettre a 0 pour desactiver completement l'import automatique.
      VEILLE_PLANIFICATEUR: ${VEILLE_PLANIFICATEUR:-}
      # DEBUG, INFO, WARNING, ERROR.
      VEILLE_LOG: ${VEILLE_LOG:-}
      # Ou vont les copies datees de la base, faites apres chaque import.
      # Par defaut a cote d'elle, DANS le volume Docker — ce qui protege de
      # l'effacement et de la corruption, mais pas de la panne du disque et
      # reste malcommode a retrouver. Voir le montage ci-dessous.
      VEILLE_SAUVEGARDES: ${VEILLE_SAUVEGARDES:-/sauvegardes}
      # Celle-ci garde son defaut : elle designe le point de MONTAGE
      # declare plus bas, pas un choix de comportement. Le code, lui,
      # ne connait pas les montages du compose.

    volumes:
      # La base SQLite. Sans ce volume, tout serait perdu a chaque mise a
      # jour de l'image par Watchtower (CDC 2).
      - veille-donnees:/data

      # Les sauvegardes, dans un DOSSIER PARTAGE et non dans un volume
      # Docker. C'est ce qui les rend perennes, pour deux raisons :
      #
      #   - on peut les voir, les copier et les emporter depuis DSM, sans
      #     ligne de commande ;
      #   - Hyper Backup sauvegarde des dossiers partages. Un volume Docker
      #     vit dans /var/lib/docker et lui echappe le plus souvent.
      #
      # Le contenu de cette base ne se retelecharge pas : DVF ne se
      # consulte que sur cinq ans, et le millesime qui sort de la fenetre
      # ne subsiste plus qu'ici.
      #
      # Creer le dossier partage dans DSM avant le premier demarrage, et
      # ajuster le chemin si le volume n'est pas /volume1.
      - ${VEILLE_DOSSIER_SAUVEGARDES:-/volume1/veille-sauvegardes}:/sauvegardes

    labels:
      # Portee du Watchtower deja en place sur le NAS. Ne pas la changer :
      # c'est ce qui fait que ce conteneur est mis a jour automatiquement,
      # sans avoir a lancer un second Watchtower.
      - "com.centurylinklabs.watchtower.scope=gestion-locative"

volumes:
  veille-donnees:
    driver: local
