# ====================================================================
#  GitHub Actions — tests, build, publication de l'image
#
#  A chaque push sur `main` : les tests tournent, puis l'image est
#  construite et poussee sur GitHub Container Registry. Le Watchtower du
#  NAS la recupere dans les minutes qui suivent.
#
#  Les tests conditionnent le build : une image cassee ne doit jamais
#  atteindre le NAS, ou elle serait deployee automatiquement.
# ====================================================================

name: Tests, build et publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Tests
        # Aucun test n'appelle le reseau : la suite reste rapide et fiable.
        run: python -m pytest tests/ -q

  image:
    needs: tests
    # Une pull request est verifiee mais rien n'est publie.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Connexion a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Le DS218+ est en x86_64. Pour un NAS ARM, ajouter
          # linux/arm64 ici et activer docker/setup-qemu-action.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
