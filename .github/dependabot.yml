# ====================================================================
#  Dependabot — des dependances qui ne vieillissent pas en silence
#
#  Tout est epingle (requirements.txt) : c'est ce qui rend une image
#  reproductible, et ce qui la laisse vieillir sans bruit. Le magasin de
#  certificats (certifi) datait de decembre 2024 ; un jour, une autorite
#  de certification renouvelee aurait fait echouer les appels aux sources
#  sans que rien dans le code n'ait change.
#
#  UNE proposition par mois et par famille, toutes mises a jour reunies :
#  le premier passage en avait ouvert dix, et chacune envoyait ses
#  courriels a l'ouverture puis a la fermeture. La CI teste chaque
#  proposition ; rien n'atteint le NAS sans etre fusionne a la main.
#
#  L'image de base n'y figure pas : `python:3.12-slim` suit deja les
#  correctifs de Python 3.12 a chaque construction, et un passage a 3.13
#  se decide, il ne se fusionne pas en passant.
# ====================================================================
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    groups:
      bibliotheques:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      outils-github:
        patterns: ["*"]
